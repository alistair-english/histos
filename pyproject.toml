[project]
name = "histos"
version = "0.1.0"
description = "A local, graph-based interface for language models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histos"]
exclude = [
    "**/*_test.py",
    "**/*_test_cases/**",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # These rules conflict with Ruff's formatter.
    "COM812",
    "ISC001",
    # Select one rule from each mutually exclusive docstring-style pair.
    "D203",
    "D213",
    # The repository has a LICENSE file instead of a header in every source file.
    "CPY001",
    # Function signatures should expose the data an operation requires.
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = [
    # Pytest uses plain assertions for introspected failure output.
    "S101",
    # Literal expected values make small tests easier to read.
    "PLR2004",
]
"**/*_test_cases/*.py" = [
    # Small fixture builders are clearer without repetitive docstrings.
    "D103",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
